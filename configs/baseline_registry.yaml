# The canonical per-series baseline registry: the stored per-(series, size, model) R² values that
# a plain model-architecture / data-efficiency comparison is scored against.
#
# ONE place to point at it, because repointing it must be a single deliberate edit — the previous
# registry id was hardcoded in six files, which is part of why a stale registry went unnoticed for
# four months (audit ML-02, docs/RETRACTIONS.md R-2).
#
# The harness does NOT trust this pointer on its own: `orchestration/baseline_guard.py` compares
# the registry's recorded provenance (numerics fingerprint, dataset/split hash) against the current
# checkout, and falls back to training an in-run baseline whenever they disagree. A registry is a
# cache of results, and a cache needs an invalidation rule.
run_id: 2026-11-02-full56-seeds

# Refuse the stored registry (and pay for an in-run baseline instead) when:
require:
  numerics_fingerprint: true      # the value-deciding source files must be unchanged
  dataset_hash: true              # same cleaned dataset
  split_hash: true                # same splits
  # The git SHA is recorded but NOT required: an unrelated docs or agent commit does not change a
  # predicted number, and a guard that fires on every commit would be disabled within a week.
  git_sha: false
  # Nor is the INFERENCE fingerprint (audit ST-2): a registry stores point values, never intervals,
  # so the estimator that was in the tree when its run-cards were written is irrelevant to using
  # those values as a control. It matters when two INTERVALS are compared, and that fence lives on
  # the comparison record (`ci_method`), not here.
  inference_fingerprint: false

# A refused registry with no recorded reason is decoration; a refused registry whose replacement is
# named and dated is an honest known state. A `pending_rebuild:` block (run_id + started + reason)
# is how that is declared, and `tests/test_retractions.py` accepts a guard refusal only while one
# is present (audit ML-01b, #69). There is deliberately no such block now: the pointer above names
# a registry its own guard accepts, so there is nothing to excuse.

superseded:
  - run_id: 2026-11-02-2026-11-02-full56
    locked: 2026-11-02
    reason: >
      Refused by its own guard the day ML-01b landed, for the reason the guard exists: two
      value-deciding files changed under it (`scripts/reproduce_baselines.py` and the new
      `src/seq2yield/data/series_sample.py`), so its 3360 values can no longer prove they match the
      code that would produce them. Separately and more importantly it holds ONE model-init seed,
      which cannot be paired seed-matched against a candidate's three — the defect ML-01b was
      about. Replaced by `2026-11-02-full56-seeds` (10,080 rows, `--model-seeds 1 2 3`). Not
      retracted: while it stood refused, the harness trained in-run baselines at the candidate's
      own seeds, which is the CORRECT comparison and merely slower, so no claim rests on the
      refused cache. Its doubled date is not corruption — `reproduce_baselines.py` prefixes `--tag`
      with the run date and this one was tagged `2026-11-02-full56`; the artifacts are kept exactly
      as the run wrote them, because renaming a generated folder away from the run_id recorded
      inside its own run-cards is the one kind of tidying this project does not do. The replacement
      was tagged `full56-seeds` instead, which is why its id reads cleanly.
  - run_id: 2026-11-01-full56
    locked: 2026-11-01
    reason: >
      Scientifically fine and NOT retracted: its 3360 values are reproduced by the current
      registry to 3.3e-16, with 3066 of 3360 rows bit-identical. It is superseded only as a
      CONTROL, because its stamp predates the per-file manifest (fingerprint v1) and so cannot be
      re-checked when the value-deciding set's own definition changes — which it did the next day,
      when the bootstrap left that set (audit ST-2, DECISIONS #65). Regenerating was the honest
      way out: a same-tag re-run would have skipped every fit and rewritten only the stamps.
  - run_id: 2026-06-04-full56
    locked: 2026-06-05
    reason: >
      Built before provenance was stamped, with RF max_features=1.0 and no CNN early stopping.
      Against current code an unchanged RF measures ΔR² −0.0158 (N=2000) / −0.0417 (N=500) against
      its own stored baseline, and CNN −0.0313; MLP reproduces bit-for-bit. Kept as history — it is
      what every claim recorded before 2026-11-01 was compared against.
