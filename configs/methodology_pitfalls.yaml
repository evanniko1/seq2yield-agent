# Methodology pitfalls knowledge base (K4). Each entry maps an OBSERVABLE diagnostic signal to a
# named methodological concern, a severity, and a suggested follow-up intervention the council can
# propose to investigate it. Trusted/deterministic: the critic applies these rules; the LLM only
# narrates. Flags are ADVISORY — they never change the harness's statistical verdict.
#
# signal: dotted path into the diagnostics dict (top-level key . field).
# op: ">" | "<" | "abs_gt" | "far_from_one" | "is_true"   threshold: numeric (where applicable)
pitfalls:
  - id: train_test_leakage
    signal: leakage.leak_frac
    op: ">"
    threshold: 0.0
    severity: high
    blocking: true            # HARD gate: an accepted result with this flag is withheld (harness)
    description: >
      Test sequences also appear in the training set, so reported performance is leaked/inflated.
    suggested: deduplicate sequences across splits, then re-run the same comparison
    intervention_hint: model_architecture

  - id: near_duplicate_leakage
    signal: leakage.near_dup_frac
    op: ">"
    threshold: 0.2
    severity: high
    # Advisory, NOT blocking: a designed library can legitimately contain families, and the honest
    # response is a grouped split, not a withheld result. Blocking here would also stop every run
    # on a variant library before anyone could act on it. (Audit SA-1/ML-03, ST-7.)
    description: >
      A large share of held-out sequences sit within a couple of substitutions of a TRAINING
      sequence, so the model is being scored on near-copies of what it memorised. The exact
      duplicate check cannot see this (adapters de-duplicate first). A random library scores ~0
      here; designed families (SNV pairs, motif perturbations, tiling, mutational series) score
      high and need a family-aware split.
    suggested: >
      declare the dataset's design families (family_col or family_distance) and re-run with
      split_strategy grouped_holdout, then compare the two numbers
    intervention_hint: sampling_design

  - id: too_few_bootstrap_units
    signal: bootstrap_units.n_units
    op: "<"
    threshold: 25
    severity: medium
    # Advisory, and the threshold is MEASURED, not guessed. Simulated type-I error of the cluster
    # bootstrap on an exactly-null clustered comparison (200 trials, nominal 5%):
    #   units:   5     10    20    40    80   200
    #   rate: 12.5% 12.5%  7.5%  6.0%  8.0%  5.5%
    # It settles near nominal from roughly 20-25 units upward and runs 2-3x hot below that, so the
    # flag fires under 25. (The same table with the SEQUENCE unit on the same clustered data:
    # 46-56% — which is the error this whole fix removes.) The bootstrap itself already refuses to
    # report any CI below 2 units; between 2 and 25 the number is reported and flagged.
    description: >
      The paired bootstrap has very few INDEPENDENT resampling units (series, or design families
      on a designed library), however many test rows there are. A CI from a handful of units is
      unreliable and the type-I error rate is well above the nominal alpha.
    suggested: >
      widen the comparison to more series/families, or hold out a larger share of families, before
      treating the verdict as settled
    intervention_hint: sampling_design

  - id: unrepresentative_split
    signal: representativeness.ks
    op: ">"
    threshold: 0.2
    severity: medium
    description: >
      The held-out target distribution differs markedly from train (large KS). The test set may
      be unrepresentative — the classic 'tail-sliced / non-stratified validation' pitfall.
    suggested: use a target-stratified split / sampling and re-test
    intervention_hint: sampling_design

  - id: overfit
    signal: generalization_gap.gap
    op: ">"
    threshold: 0.15
    severity: medium
    description: >
      Large train-minus-test R² gap: the model fits training structure that does not generalize.
    suggested: regularize via hyperparameter tuning, or add data
    intervention_hint: training_procedure

  - id: data_limited
    signal: learning_curve.still_improving
    op: is_true
    severity: low
    description: >
      Candidate R² is still rising at the largest train size: performance is data-limited and a
      single-size verdict understates the model.
    suggested: extend the data-efficiency sweep to larger training sizes
    intervention_hint: data_efficiency

  - id: miscalibration
    signal: calibration.slope
    op: far_from_one
    threshold: 0.25
    severity: low
    description: >
      Calibration slope (actual ~ predicted) is far from 1: systematic over/under-confidence,
      typically regression-to-the-mean compression.
    suggested: try a better-calibrated model family or post-hoc calibration
    intervention_hint: model_architecture

  - id: extrapolation
    signal: coverage.extrapolated_frac
    op: ">"
    threshold: 0.05
    severity: low
    description: >
      A non-trivial fraction of test targets fall outside the training target range: the model is
      asked to extrapolate.
    suggested: broaden training coverage of the target range via sampling
    intervention_hint: sampling_design

  - id: prediction_bias
    signal: residuals.mean_residual
    op: abs_gt
    threshold: 0.1
    severity: low
    description: >
      Non-zero mean residual: systematic prediction bias (often a scaling/centering issue).
    suggested: check feature scaling / target centering
    intervention_hint: feature_scaling
